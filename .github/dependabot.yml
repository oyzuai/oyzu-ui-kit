# Update proposals remain subject to maintainer review and existing attribution requirements.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: daily
    time: "06:20"
    timezone: America/New_York
  open-pull-requests-limit: 3
  assignees:
  - micahlmartin
  groups:
    routine-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-dependencies:
      applies-to: security-updates
      patterns:
      - '*'
